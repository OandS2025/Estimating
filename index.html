<!DOCTYPE html>
<html>
<head>
  <title>O&S Concreting Estimating System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 8px 20px 0;
    }

    button:hover {
      background: #374151;
    }

    .result {
      background: white;
      padding: 22px;
      border-radius: 12px;
      border-left: 6px solid #111827;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
    }

    .highlight {
      font-weight: bold;
      background: #f3f4f6;
    }

    .small {
      color: #6b7280;
      font-size: 13px;
    }

    @media print {
      button, input, select, textarea, label {
        display: none;
      }

      body {
        background: white;
      }

      .box {
        box-shadow: none;
      }

      .grid {
        display: block;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>O&S Concreting & Earthmoving</h1>
    <p>Professional Slab, Reinforcement, Piling & Earthworks Estimating System</p>
  </div>

  <div class="grid">

    <div class="box">
      <h3>Project Details</h3>

      <label>Project Name</label>
      <input type="text" id="projectName">

      <label>Builder / Client</label>
      <input type="text" id="builder">

      <label>Location</label>
      <input type="text" id="location">

      <label>Tender Deadline</label>
      <input type="date" id="deadline">

      <label>Slab Type</label>
      <select id="slabType">
        <option>Raft Slab</option>
        <option>Conventional Slab</option>
        <option>Waffle Slab</option>
        <option>Pavement Slab</option>
        <option>Suspended Slab</option>
      </select>
    </div>

    <div class="box">
      <h3>Concrete Slab</h3>

      <label>Slab Area (m²)</label>
      <input type="number" id="slabArea">

      <label>Slab Thickness (mm)</label>
      <input type="number" id="slabThickness">

      <label>Slab Length (m) - Optional</label>
      <input type="number" id="slabLength">

      <label>Slab Width (m) - Optional</label>
      <input type="number" id="slabWidth">
    </div>

    <div class="box">
      <h3>Reinforcement</h3>

      <label>Mesh Type</label>
      <select id="meshType">
        <option>SL72</option>
        <option>SL82</option>
        <option>SL92</option>
        <option>Double Mesh</option>
        <option>As per structural drawings</option>
      </select>

      <label>Mesh Sheet Area Allowance (m² per sheet)</label>
      <input type="number" id="sheetArea" value="11.52">

      <label>Waste Factor (%)</label>
      <input type="number" id="wasteFactor" value="5">

      <label>Bar / Extra Reinforcement Notes</label>
      <textarea id="reoNotes"></textarea>
    </div>

    <div class="box">
      <h3>Edge Beam / Thickening</h3>

      <label>Total Edge Beam Length (m)</label>
      <input type="number" id="edgeLength">

      <label>Edge Beam Width (mm)</label>
      <input type="number" id="edgeWidth">

      <label>Edge Beam Depth (mm)</label>
      <input type="number" id="edgeDepth">
    </div>

    <div class="box">
      <h3>Bored Piers</h3>

      <label>Number of Piers</label>
      <input type="number" id="pierQty">

      <label>Pier Diameter (mm)</label>
      <input type="number" id="pierDiameter">

      <label>Pier Depth (m)</label>
      <input type="number" id="pierDepth">
    </div>

    <div class="box">
      <h3>Earthworks</h3>

      <label>Cut Volume - Solid (m³)</label>
      <input type="number" id="cutVolume">

      <label>Fill Volume (m³)</label>
      <input type="number" id="fillVolume">

      <label>Loose Conversion Factor</label>
      <input type="number" id="looseFactor" value="1.30" step="0.01">

      <label>Earthworks Notes</label>
      <textarea id="earthNotes"></textarea>
    </div>

    <div class="box">
      <h3>Blinding</h3>

      <label>Blinding Area (m²)</label>
      <input type="number" id="blindingArea">

      <label>Blinding Thickness (mm)</label>
      <input type="number" id="blindingThickness">
    </div>

    <div class="box">
      <h3>Scope Notes</h3>

      <label>Pump Required?</label>
      <select id="pumpRequired">
        <option>Yes</option>
        <option>No</option>
        <option>To be confirmed</option>
      </select>

      <label>Special Inclusions</label>
      <textarea id="inclusions"></textarea>

      <label>Special Exclusions</label>
      <textarea id="exclusions"></textarea>
    </div>

  </div>

  <button onclick="generateEstimate()">Generate BOQ</button>
  <button onclick="window.print()">Print / Save as PDF</button>

  <div class="result" id="output">
    <h2>Tender BOQ will appear here</h2>
    <p class="small">Enter details above and click Generate BOQ.</p>
  </div>

</div>

<script>
function val(id) {
  return document.getElementById(id).value || "";
}

function num(id) {
  return parseFloat(document.getElementById(id).value) || 0;
}

function generateEstimate() {
  const projectName = val("projectName");
  const builder = val("builder");
  const location = val("location");
  const deadline = val("deadline");
  const slabType = val("slabType");

  const slabArea = num("slabArea");
  const slabThickness = num("slabThickness");
  const slabVolume = slabArea * (slabThickness / 1000);

  const slabLength = num("slabLength");
  const slabWidth = num("slabWidth");
  const formworkPerimeter = slabLength && slabWidth ? (slabLength + slabWidth) * 2 : 0;

  const sheetArea = num("sheetArea");
  const wasteFactor = num("wasteFactor");
  const meshSheets = sheetArea ? (slabArea / sheetArea) * (1 + wasteFactor / 100) : 0;

  const edgeLength = num("edgeLength");
  const edgeWidth = num("edgeWidth") / 1000;
  const edgeDepth = num("edgeDepth") / 1000;
  const edgeBeamVolume = edgeLength * edgeWidth * edgeDepth;

  const pierQty = num("pierQty");
  const pierDiameter = num("pierDiameter");
  const pierDepth = num("pierDepth");
  const pierRadius = (pierDiameter / 1000) / 2;
  const pierVolume = pierQty * Math.PI * pierRadius * pierRadius * pierDepth;

  const cutVolume = num("cutVolume");
  const fillVolume = num("fillVolume");
  const looseFactor = num("looseFactor");
  const netCutFill = cutVolume - fillVolume;
  const looseExport = netCutFill > 0 ? netCutFill * looseFactor : 0;

  const blindingArea = num("blindingArea");
  const blindingThickness = num("blindingThickness");
  const blindingVolume = blindingArea * (blindingThickness / 1000);

  const totalConcrete = slabVolume + edgeBeamVolume + pierVolume + blindingVolume;

  document.getElementById("output").innerHTML = `
    <h2>Professional Tender BOQ</h2>

    <h3>Project Summary</h3>
    <table>
      <tr><th>Item</th><th>Details</th></tr>
      <tr><td>Project</td><td>${projectName}</td></tr>
      <tr><td>Builder / Client</td><td>${builder}</td></tr>
      <tr><td>Location</td><td>${location}</td></tr>
      <tr><td>Tender Deadline</td><td>${deadline}</td></tr>
      <tr><td>Slab Type</td><td>${slabType}</td></tr>
      <tr><td>Pump Required</td><td>${val("pumpRequired")}</td></tr>
    </table>

    <h3>Concrete Quantity Takeoff</h3>
    <table>
      <tr><th>Description</th><th>Quantity</th><th>Unit</th></tr>
      <tr><td>Slab Area</td><td>${slabArea.toFixed(2)}</td><td>m²</td></tr>
      <tr><td>Slab Thickness</td><td>${slabThickness.toFixed(0)}</td><td>mm</td></tr>
      <tr><td>Slab Concrete Volume</td><td>${slabVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Edge Beam / Thickening Volume</td><td>${edgeBeamVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Bored Pier Concrete Volume</td><td>${pierVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Blinding Concrete Volume</td><td>${blindingVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr class="highlight"><td>Total Estimated Concrete</td><td>${totalConcrete.toFixed(2)}</td><td>m³</td></tr>
    </table>

    <h3>Reinforcement Takeoff</h3>
    <table>
      <tr><th>Description</th><th>Quantity</th><th>Unit</th></tr>
      <tr><td>Mesh Type</td><td>${val("meshType")}</td><td>-</td></tr>
      <tr><td>Mesh Sheet Allowance</td><td>${sheetArea.toFixed(2)}</td><td>m²/sheet</td></tr>
      <tr><td>Waste Factor</td><td>${wasteFactor.toFixed(1)}</td><td>%</td></tr>
      <tr class="highlight"><td>Estimated Mesh Sheets Required</td><td>${Math.ceil(meshSheets)}</td><td>sheets</td></tr>
    </table>

    <h3>Earthworks Takeoff</h3>
    <table>
      <tr><th>Description</th><th>Quantity</th><th>Unit</th></tr>
      <tr><td>Cut Volume - Solid</td><td>${cutVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Fill Volume</td><td>${fillVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Net Cut / Fill Difference</td><td>${netCutFill.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Loose Export Volume</td><td>${looseExport.toFixed(2)}</td><td>m³</td></tr>
    </table>

    <h3>Formwork / Perimeter</h3>
    <table>
      <tr><th>Description</th><th>Quantity</th><th>Unit</th></tr>
      <tr><td>Estimated Slab Perimeter</td><td>${formworkPerimeter.toFixed(2)}</td><td>m</td></tr>
    </table>

    <h3>Scope of Works</h3>
    <ul>
      <li>Review of structural, civil and architectural documentation.</li>
      <li>Set-out coordination based on approved drawings.</li>
      <li>Formwork preparation to slab edges, rebates, step-downs and thickening where applicable.</li>
      <li>Supply and installation of nominated reinforcement as per structural documentation.</li>
      <li>Concrete placement, screeding and finishing to nominated slab areas.</li>
      <li>Installation of bored piers where nominated above.</li>
      <li>Blinding layer where nominated above.</li>
      <li>General coordination with builder and site team during works.</li>
    </ul>

    <h3>Reinforcement Notes</h3>
    <p>${val("reoNotes")}</p>

    <h3>Earthworks Notes</h3>
    <p>${val("earthNotes")}</p>

    <h3>Special Inclusions</h3>
    <p>${val("inclusions")}</p>

    <h3>Assumptions</h3>
    <ul>
      <li>Quantities are based on information entered into this system.</li>
      <li>Final quantities are subject to review against IFC drawings and site conditions.</li>
      <li>Concrete volumes are calculated from nominated dimensions and do not include wastage unless separately allowed.</li>
      <li>Mesh sheet quantity includes nominated waste factor.</li>
      <li>Loose export volume is calculated using the nominated loose conversion factor.</li>
      <li>No pricing, rates or dollar values are included in this BOQ.</li>
    </ul>

    <h3>Exclusions</h3>
    <ul>
      <li>Authority fees, permits and inspections unless specifically noted.</li>
      <li>Survey set-out unless specifically noted.</li>
      <li>Rock excavation unless specifically noted.</li>
      <li>Contaminated material handling unless specifically noted.</li>
      <li>Dewatering unless specifically noted.</li>
      <li>${val("exclusions")}</li>
    </ul>
  `;
}
</script>

</body>
</html>
