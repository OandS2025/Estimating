<!DOCTYPE html>
<html>
<head>
  <title>O&S Concreting Estimating System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 5px 0 0;
      color: #d1d5db;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, textarea, select {
      width: 100%;
      padding: 9px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      height: 80px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px 20px 0;
    }

    button:hover {
      background: #374151;
    }

    .result {
      background: white;
      padding: 20px;
      border-radius: 10px;
      border-left: 6px solid #111827;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
    }

    .small {
      color: #666;
      font-size: 13px;
    }

    @media print {
      button, input, textarea, select, label {
        display: none;
      }
      body {
        background: white;
      }
      .box {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>O&S Concreting & Earthmoving</h1>
    <p>Professional Estimating System – Concrete, Earthworks & Piling</p>
  </div>

  <div class="grid">

    <div class="box">
      <h3>Project Information</h3>

      <label>Project Name</label>
      <input type="text" id="projectName">

      <label>Builder / Client</label>
      <input type="text" id="builder">

      <label>Location</label>
      <input type="text" id="location">

      <label>Tender Deadline</label>
      <input type="date" id="deadline">

      <label>Slab Type</label>
      <select id="slabType">
        <option>Raft Slab</option>
        <option>Conventional Slab</option>
        <option>Waffle Slab</option>
        <option>Pavement Slab</option>
        <option>Suspended Slab</option>
      </select>
    </div>

    <div class="box">
      <h3>Concrete Slab</h3>

      <label>Slab Area (m²)</label>
      <input type="number" id="slabArea">

      <label>Slab Thickness (mm)</label>
      <input type="number" id="slabThickness">

      <label>Blinding Area (m²)</label>
      <input type="number" id="blindingArea">

      <label>Blinding Thickness (mm)</label>
      <input type="number" id="blindingThickness">
    </div>

    <div class="box">
      <h3>Bored Piers / Piling</h3>

      <label>Number of Piers</label>
      <input type="number" id="pierQty">

      <label>Pier Diameter (mm)</label>
      <input type="number" id="pierDiameter">

      <label>Pier Depth (m)</label>
      <input type="number" id="pierDepth">
    </div>

    <div class="box">
      <h3>Earthworks</h3>

      <label>Cut Volume (m³)</label>
      <input type="number" id="cutVolume">

      <label>Fill Volume (m³)</label>
      <input type="number" id="fillVolume">

      <label>Export / Disposal Volume (m³)</label>
      <input type="number" id="exportVolume">

      <label>Earthworks Notes</label>
      <textarea id="earthNotes"></textarea>
    </div>

    <div class="box">
      <h3>Reinforcement</h3>

      <label>Mesh Type</label>
      <input type="text" id="meshType" placeholder="Example: SL92 / SL82 / Double mesh">

      <label>Bar Reinforcement Notes</label>
      <textarea id="reoNotes"></textarea>
    </div>

    <div class="box">
      <h3>Scope Notes</h3>

      <label>Special Inclusions</label>
      <textarea id="inclusions"></textarea>

      <label>Special Exclusions</label>
      <textarea id="exclusions"></textarea>
    </div>

  </div>

  <button onclick="generateEstimate()">Generate Tender BOQ</button>
  <button onclick="window.print()">Print / Save as PDF</button>

  <div class="result" id="output">
    <h2>Tender BOQ will appear here</h2>
    <p class="small">Enter the project details above and click Generate Tender BOQ.</p>
  </div>

</div>

<script>
function val(id) {
  return document.getElementById(id).value || "";
}

function num(id) {
  return parseFloat(document.getElementById(id).value) || 0;
}

function generateEstimate() {
  let projectName = val("projectName");
  let builder = val("builder");
  let location = val("location");
  let deadline = val("deadline");
  let slabType = val("slabType");

  let slabArea = num("slabArea");
  let slabThickness = num("slabThickness");
  let slabVolume = slabArea * (slabThickness / 1000);

  let blindingArea = num("blindingArea");
  let blindingThickness = num("blindingThickness");
  let blindingVolume = blindingArea * (blindingThickness / 1000);

  let pierQty = num("pierQty");
  let pierDiameter = num("pierDiameter");
  let pierDepth = num("pierDepth");
  let radius = (pierDiameter / 1000) / 2;
  let pierVolume = pierQty * Math.PI * radius * radius * pierDepth;

  let cutVolume = num("cutVolume");
  let fillVolume = num("fillVolume");
  let exportVolume = num("exportVolume");

  let totalConcrete = slabVolume + blindingVolume + pierVolume;

  let output = `
    <h2>Professional Tender BOQ</h2>

    <h3>Project Summary</h3>
    <table>
      <tr><th>Item</th><th>Details</th></tr>
      <tr><td>Project</td><td>${projectName}</td></tr>
      <tr><td>Builder / Client</td><td>${builder}</td></tr>
      <tr><td>Location</td><td>${location}</td></tr>
      <tr><td>Tender Deadline</td><td>${deadline}</td></tr>
      <tr><td>Slab Type</td><td>${slabType}</td></tr>
    </table>

    <h3>Quantity Takeoff</h3>
    <table>
      <tr><th>Description</th><th>Quantity</th><th>Unit</th></tr>
      <tr><td>Slab Area</td><td>${slabArea.toFixed(2)}</td><td>m²</td></tr>
      <tr><td>Slab Thickness</td><td>${slabThickness.toFixed(0)}</td><td>mm</td></tr>
      <tr><td>Slab Concrete Volume</td><td>${slabVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Blinding Concrete Volume</td><td>${blindingVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Bored Pier Concrete Volume</td><td>${pierVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td><b>Total Estimated Concrete</b></td><td><b>${totalConcrete.toFixed(2)}</b></td><td><b>m³</b></td></tr>
      <tr><td>Cut Volume</td><td>${cutVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Fill Volume</td><td>${fillVolume.toFixed(2)}</td><td>m³</td></tr>
      <tr><td>Export / Disposal Volume</td><td>${exportVolume.toFixed(2)}</td><td>m³</td></tr>
    </table>

    <h3>Reinforcement</h3>
    <p><b>Mesh Type:</b> ${val("meshType")}</p>
    <p><b>Reinforcement Notes:</b><br>${val("reoNotes")}</p>

    <h3>Scope of Works</h3>
    <ul>
      <li>Review of structural, civil and architectural documentation.</li>
      <li>Set-out coordination based on approved drawings.</li>
      <li>Formwork preparation to slab edges, rebates and set-downs where applicable.</li>
      <li>Supply and installation of nominated reinforcement as per documentation.</li>
      <li>Concrete placement, screeding and finishing to nominated slab areas.</li>
      <li>Installation of bored piers where nominated above.</li>
      <li>Blinding layer where nominated above.</li>
      <li>General coordination with builder and site team during works.</li>
    </ul>

    <h3>Earthworks Notes</h3>
    <p>${val("earthNotes")}</p>

    <h3>Special Inclusions</h3>
    <p>${val("inclusions")}</p>

    <h3>Assumptions</h3>
    <ul>
      <li>Quantities are based on information entered and available drawings/details.</li>
      <li>Concrete volumes are calculated from slab area and nominated thickness.</li>
      <li>Pier volumes are calculated using circular pier formula based on quantity, diameter and depth.</li>
      <li>Final quantities are subject to confirmation against IFC drawings and site conditions.</li>
      <li>No pricing, rates or dollar values are included in this BOQ.</li>
    </ul>

    <h3>Exclusions</h3>
    <ul>
      <li>Authority fees, permits and inspections unless specifically noted.</li>
      <li>Survey set-out unless specifically noted.</li>
      <li>Rock excavation unless specifically noted.</li>
      <li>Contaminated material handling unless specifically noted.</li>
      <li>Dewatering unless specifically noted.</li>
      <li>${val("exclusions")}</li>
    </ul>
  `;

  document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
